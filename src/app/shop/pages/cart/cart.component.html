<app-page-header [data]="pageHeaderData" />

<div id="cart" class="section-p1">
    <table width="100%">
        <thead>
            <tr>
                <td>Remover</td>
                <td>Imagen</td>
                <td>Producto</td>
                <td>Precio</td>
                <td>Cantidad</td>
                <td>Subtotal</td>
            </tr>
        </thead>
        <tbody>
            @for(item of cartItems(); track $index) {
            <tr>
                <td><i (click)="removeItem(item.id)" class="fa fa-trash"></i></td>
                <td><img [src]="item.img" alt=""></td>
                <td>{{item.title}}</td>
                <td>${{item.price}}</td>
                <td>
                    <a (click)="decreaseQty(item.id)"><i class="fa fa-minus decrement-cart"></i></a>
                    <input [value]="item.quantity" min="1" (change)="updateQty($event, item.id)">
                    <a (click)="increaseQty(item.id)"><i class="fa fa-plus increment-cart"></i></a>
                </td>
                <td>${{item.subtotal}}</td>
            </tr>
            }
        </tbody>
    </table>
</div>

<div id="cart-add" class="section-p1">
    <div id="coupon">
        <h3>Apply Coupon</h3>
        <div>
            <input type="text" placeholder="Enter Your Coupon">
            <button class="normal">Apply</button>
        </div>
    </div>
    <div id="subtotal">
        <h3>Cart Totals</h3>
        <table>
            <tr>
                <td>Cart Subtotal</td>
                <td>${{cartTotal()}}</td>
            </tr>
            <tr>
                <td>Shipping</td>
                <td>Free</td>
            </tr>
            <tr>
                <td><strong>Total</strong></td>
                <td><strong>${{cartTotal()}}</strong></td>
            </tr>
        </table>
        <button (click)="togglePaymentForm()" class="normal">Proceed to checkout</button>
    </div>
</div>

@if (showPaymentForm()) {
<div class="modal-backdrop" *ngIf="showPaymentForm()"></div>

<app-pay-form />
}
